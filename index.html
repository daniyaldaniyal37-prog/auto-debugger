    <script>
      // Initialize React Fast Refresh preamble synchronously
      window.$RefreshReg$ = window.$RefreshReg$ || function() {};
      window.$RefreshSig$ = window.$RefreshSig$ || function() { return function(type) { return type; }; };
    </script>
    <script>
      // HMR: Disabled in AI Studio preview. Ignore harmless Vite WebSocket connection errors.
      window.addEventListener('error', function(event) {
        if (
          event.message &&
          (event.message.includes('WebSocket') ||
           event.message.includes('@vite/client') ||
           event.message.includes('createWebSocketModuleRunnerTransport'))
        ) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
      window.addEventListener('unhandledrejection', function(event) {
        const reason = String(event.reason || '');
        if (
          reason.includes('WebSocket') ||
          reason.includes('@vite/client') ||
          reason.includes('createWebSocketModuleRunnerTransport')
        ) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
    </script>
  </head>
